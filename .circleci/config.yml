version: 2.1

jobs:
  atoti_query_tests:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-atoti-{{ checksum "atoti-query-analyser/package.json" }}
      - run:
          name: Install dependencies
          command: yarn install --cwd atoti-query-analyser
      - run:
          name: Run unit tests and check coverage thresholds
          command: yarn --cwd atoti-query-analyser test:coverage
      - store_test_results:
          path: atoti-query-analyser/test-results
      - store_artifacts:
          path: atoti-query-analyser/coverage
          destination: coverage
      # not saving the cache, as we leave it to the other job
  atoti_query_e2e:
    docker:
      # Keep the tag aligned with the @playwright/test version in package.json
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-atoti-{{ checksum "atoti-query-analyser/package.json" }}
      - run:
          name: Install yarn
          command: command -v yarn || npm install -g yarn@1.22.22
      - run:
          name: Install dependencies
          command: yarn install --cwd atoti-query-analyser
      - run:
          name: Run end-to-end tests
          command: yarn --cwd atoti-query-analyser e2e
      - store_test_results:
          path: atoti-query-analyser/test-results/e2e
      - store_artifacts:
          path: atoti-query-analyser/playwright-report
          destination: playwright-report
      - store_artifacts:
          path: atoti-query-analyser/test-results/e2e/artifacts
          destination: playwright-artifacts
      # not saving the cache, as we leave it to the other job
  atoti_query:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-atoti-{{ checksum "atoti-query-analyser/package.json" }}
      - run:
          name: Install dependencies
          command: yarn install --cwd atoti-query-analyser
      - run:
          name: Build application
          command: yarn --cwd atoti-query-analyser build
      - save_cache:
          key: deps-atoti-{{ checksum "atoti-query-analyser/package.json" }}
          paths:
            - atoti-query-analyser/node_modules
      - run:
          name: Move to workspace
          command: |
            mkdir -p _build
            mv atoti-query-analyser/build _build/atoti_query
      - persist_to_workspace:
          root: _build
          paths: atoti_query
  deploy_to_master:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - attach_workspace:
          at: _build
      - run:
          name: Install and configure dependencies
          command: yarn global add gh-pages@2.2.0 --prefix "$HOME"
      - add_ssh_keys:
          fingerprints:
            - "bf:66:81:20:29:0d:57:42:bf:6b:78:7b:07:6f:69:6a"
      - run:
          name: Deploy applications to master
          command: |
            gh-pages --src index.html  \
              --dist . \
              --dest . \
              --add \
              --branch master \
              --message "Deploy root files" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist queryplan-analyzer \
              --dest queryplan-analyzer \
              --branch master \
              --message "Deploy legacy query analyzer" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist flightrecording-analyzer \
              --dest flightrecording-analyzer \
              --branch master \
              --message "Deploy JFR analyzer" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist _build/atoti_query \
              --dest atoti-query-analyser \
              --branch master \
              --message "Deploy Query analyzer" \
              --user "ci-build <ci-build@activeviam.com>"

workflows:
  version: 2
  build:
    jobs:
      - atoti_query_tests:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - atoti_query_e2e:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - atoti_query:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - deploy_to_master:
          requires:
            - atoti_query
          filters:
            branches:
              only: develop
