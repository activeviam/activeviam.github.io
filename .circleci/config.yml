version: 2.1

commands:
  install_atoti_dependencies:
    description: Install pnpm, at the version set by packageManager, and the dependencies of atoti-query-analyser
    steps:
      - restore_cache:
          keys:
            - pnpm-atoti-{{ checksum "atoti-query-analyser/pnpm-lock.yaml" }}
            - pnpm-atoti-
      - run:
          name: Install pnpm
          command: |
            npm install --global --prefix "$HOME/.local" "$(node -p 'require("./atoti-query-analyser/package.json").packageManager')"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: pnpm --dir atoti-query-analyser install --frozen-lockfile --store-dir "$PWD/.pnpm-store"

jobs:
  atoti_query_tests:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - install_atoti_dependencies
      - run:
          name: Run unit tests and check coverage thresholds
          command: pnpm --dir atoti-query-analyser test:coverage
      - store_test_results:
          path: atoti-query-analyser/test-results
      - store_artifacts:
          path: atoti-query-analyser/coverage
          destination: coverage
      # not saving the cache, as we leave it to the other job
  atoti_query_lint:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - install_atoti_dependencies
      - run:
          name: Check formatting with oxfmt
          command: pnpm --dir atoti-query-analyser format:check
      - run:
          name: Lint with oxlint
          command: pnpm --dir atoti-query-analyser lint
      - run:
          name: Type-check with tsc
          command: pnpm --dir atoti-query-analyser typecheck
      # not saving the cache, as we leave it to the other job
  atoti_query_e2e:
    docker:
      # Keep the tag aligned with the @playwright/test version in package.json
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      CI: "true"
    steps:
      - checkout
      - install_atoti_dependencies
      - run:
          name: Run end-to-end tests
          command: pnpm --dir atoti-query-analyser e2e
      - store_test_results:
          path: atoti-query-analyser/test-results/e2e
      - store_artifacts:
          path: atoti-query-analyser/playwright-report
          destination: playwright-report
      - store_artifacts:
          path: atoti-query-analyser/test-results/e2e/artifacts
          destination: playwright-artifacts
      # not saving the cache, as we leave it to the other job
  atoti_query:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - install_atoti_dependencies
      - run:
          name: Build application
          command: pnpm --dir atoti-query-analyser build
      - save_cache:
          key: pnpm-atoti-{{ checksum "atoti-query-analyser/pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
      - run:
          name: Move to workspace
          command: |
            mkdir -p _build
            mv atoti-query-analyser/build _build/atoti_query
      - persist_to_workspace:
          root: _build
          paths: atoti_query
  deploy_to_master:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - attach_workspace:
          at: _build
      - run:
          name: Install and configure dependencies
          command: npm install --global --prefix "$HOME" gh-pages@2.2.0
      - add_ssh_keys:
          fingerprints:
            - "bf:66:81:20:29:0d:57:42:bf:6b:78:7b:07:6f:69:6a"
      - run:
          name: Deploy applications to master
          command: |
            gh-pages --src index.html  \
              --dist . \
              --dest . \
              --add \
              --branch master \
              --message "Deploy root files" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist queryplan-analyzer \
              --dest queryplan-analyzer \
              --branch master \
              --message "Deploy legacy query analyzer" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist flightrecording-analyzer \
              --dest flightrecording-analyzer \
              --branch master \
              --message "Deploy JFR analyzer" \
              --user "ci-build <ci-build@activeviam.com>"
            gh-pages --dist _build/atoti_query \
              --dest atoti-query-analyser \
              --branch master \
              --message "Deploy Query analyzer" \
              --user "ci-build <ci-build@activeviam.com>"

workflows:
  version: 2
  build:
    jobs:
      - atoti_query_tests:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - atoti_query_lint:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - atoti_query_e2e:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - atoti_query:
          filters:
            branches:
              ignore:
                - master
                - /wip-*/
      - deploy_to_master:
          requires:
            - atoti_query
            - atoti_query_lint
          filters:
            branches:
              only: develop
